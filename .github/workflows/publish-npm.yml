name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install an npm version with trusted publishing support
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Set package version from the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: Verify package
        run: |
          npm run check
          npm test

      - name: Publish stable release
        if: ${{ !github.event.release.prerelease }}
        run: npm publish --provenance --access public

      - name: Publish prerelease
        if: ${{ github.event.release.prerelease }}
        run: npm publish --provenance --access public --tag next
